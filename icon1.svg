<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 1. 绿山渐变 1（后山：柔和偏浅） -->
    <linearGradient id="back-mountain-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D1FAE5" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- 2. 绿山渐变 2（前山：现代绿渐变） -->
    <linearGradient id="front-mountain-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- 3. 艺术白天空渐变 -->
    <linearGradient id="art-white-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF9" />
      <stop offset="100%" stop-color="#F5F5F4" />
    </linearGradient>
  </defs>

  <!-- 1. 亮色应用图标背景（浅灰蓝） -->
  <rect width="512" height="512" rx="108" fill="#F1F5F9" />

  <!-- 2. 物理阴影层 -->
  <rect x="106" y="112" width="300" height="300" rx="36" fill="#CBD5E1" opacity="0.5" />

  <!-- 3. 主体纯白色相框 -->
  <rect x="106" y="106" width="300" height="300" rx="36" fill="#FFFFFF" />
  
  <!-- 相框内照片区域 -->
  <clipPath id="frame-inner">
    <rect x="126" y="126" width="260" height="260" rx="20" />
  </clipPath>
  
  <g clip-path="url(#frame-inner)">
    <!-- 4. 艺术白天空 -->
    <rect x="126" y="126" width="260" height="260" fill="url(#art-white-sky)" />

    <!-- 5. 5颗展开的四角星图层（已移除 <use> 兼容安卓） -->
    
    <!-- 【大星 310,180】 -->
    <g transform="translate(310, 181.5) scale(1.35)" opacity="0.1">
      <path d="M 0 -18 C 0 -4, 4 0, 18 0 C 4 0, 0 4, 0 18 C 0 4, -4 0, -18 0 C -4 0, 0 -4, 0 -18 Z" fill="#D97706" />
    </g>
    <g transform="translate(310, 180) scale(1.35)">
      <path d="M 0 -18 C 0 -4, 4 0, 18 0 C 4 0, 0 4, 0 18 C 0 4, -4 0, -18 0 C -4 0, 0 -4, 0 -18 Z" fill="#F59E0B" />
      <path d="M 0 -11 C 0 -2, 2 0, 11 0 C 2 0, 0 2, 0 11 C 0 2, -2 0, -11 0 C -2 0, 0 -2, 0 -11 Z" fill="#FEF08A" />
    </g>

    <!-- 【中星 180,200】 -->
    <g transform="translate(180, 201) scale(0.95)" opacity="0.1">
      <path d="M 0 -18 C 0 -4, 4 0, 18 0 C 4 0, 0 4, 0 18 C 0 4, -4 0, -18 0 C -4 0, 0 -4, 0 -18 Z" fill="#D97706" />
    </g>
    <g transform="translate(180, 200) scale(0.95)">
      <path d="M 0 -18 C 0 -4, 4 0, 18 0 C 4 0, 0 4, 0 18 C 0 4, -4 0, -18 0 C -4 0, 0 -4, 0 -18 Z" fill="#F59E0B" />
      <path d="M 0 -11 C 0 -2, 2 0, 11 0 C 2 0, 0 2, 0 11 C 0 2, -2 0, -11 0 C -2 0, 0 -2, 0 -11 Z" fill="#FEF08A" />
    </g>

    <!-- 【小星 245,220】 -->
    <g transform="translate(245, 220.7) scale(0.65)" opacity="0.1">
      <path d="M 0 -18 C 0 -4, 4 0, 18 0 C 4 0, 0 4, 0 18 C 0 4, -4 0, -18 0 C -4 0, 0 -4, 0 -18 Z" fill="#D97706" />
    </g>
    <g transform="translate(245, 220) scale(0.65)">
      <path d="M 0 -18 C 0 -4, 4 0, 18 0 C 4 0, 0 4, 0 18 C 0 4, -4 0, -18 0 C -4 0, 0 -4, 0 -18 Z" fill="#F59E0B" />
      <path d="M 0 -11 C 0 -2, 2 0, 11 0 C 2 0, 0 2, 0 11 C 0 2, -2 0, -11 0 C -2 0, 0 -2, 0 -11 Z" fill="#FEF08A" />
    </g>

    <!-- 【微星 1 (150,155)】 -->
    <g transform="translate(150, 155.5) scale(0.45)" opacity="0.1">
      <path d="M 0 -18 C 0 -4, 4 0, 18 0 C 4 0, 0 4, 0 18 C 0 4, -4 0, -18 0 C -4 0, 0 -4, 0 -18 Z" fill="#D97706" />
    </g>
    <g transform="translate(150, 155) scale(0.45)">
      <path d="M 0 -18 C 0 -4, 4 0, 18 0 C 4 0, 0 4, 0 18 C 0 4, -4 0, -18 0 C -4 0, 0 -4, 0 -18 Z" fill="#F59E0B" />
      <path d="M 0 -11 C 0 -2, 2 0, 11 0 C 2 0, 0 2, 0 11 C 0 2, -2 0, -11 0 C -2 0, 0 -2, 0 -11 Z" fill="#FEF08A" />
    </g>

    <!-- 【微星 2 (345,215)】 -->
    <g transform="translate(345, 215.5) scale(0.45)" opacity="0.1">
      <path d="M 0 -18 C 0 -4, 4 0, 18 0 C 4 0, 0 4, 0 18 C 0 4, -4 0, -18 0 C -4 0, 0 -4, 0 -18 Z" fill="#D97706" />
    </g>
    <g transform="translate(345, 215) scale(0.45)">
      <path d="M 0 -18 C 0 -4, 4 0, 18 0 C 4 0, 0 4, 0 18 C 0 4, -4 0, -18 0 C -4 0, 0 -4, 0 -18 Z" fill="#F59E0B" />
      <path d="M 0 -11 C 0 -2, 2 0, 11 0 C 2 0, 0 2, 0 11 C 0 2, -2 0, -11 0 C -2 0, 0 -2, 0 -11 Z" fill="#FEF08A" />
    </g>

    <!-- 6. 无边框渐变绿色山脉 -->
    <!-- 后山 -->
    <polygon points="110,390 220,260 330,390" fill="url(#back-mountain-grad)" />
    
    <!-- 前山 -->
    <polygon points="180,390 290,230 410,390" fill="url(#front-mountain-grad)" />
  </g>

  <!-- 7. 极细浅灰边界分割线 -->
  <rect x="126" y="126" width="260" height="260" rx="20" fill="none" stroke="#E2E8F0" stroke-width="1.5" />
</svg>
[versions]
# AGP 和 Kotlin
agp = "9.3.1"
kotlin = "2.4.10"
kotlinParcelize = "2.4.10"
ksp = "2.3.10"

# AndroidX 核心
coreKtx = "1.19.0"
splashscreen = "1.2.0"
appcompat = "1.7.1"
material = "1.14.0"
constraintlayout = "2.2.1"
activityKtx = "1.13.0"
fragmentKtx = "1.8.9"
lifecycleRuntimeKtx = "2.11.0"
lifecycleViewmodelKtx = "2.11.0"

# 图片加载
# Glide 5.0.9：与 jxl-coder-glide 2.6.1 匹配（该库运行时依赖 glide 5.0.7+）。
# 5.0.8/5.0.9 修复了 ImageDecoder 的 OOM/ANR、Android R+ 不再对 Uri 追加
# requireOriginal、后台内存回收更智能（仅在 UI_HIDDEN 以上才降内存类别）。
# 5.0 相比 4.16 无重大公共 API 变更，本项目使用标准 API，兼容。
glide = "5.0.9"
glideRecyclerview = "5.0.9"
# zoomimage 1.6.0（GA）：详情页 ZoomImageView/subsampling API。
# 1.6.0 的 zoomimage-core-glide 依赖 Glide 5.0.7（与本次 Glide 升级匹配）。
# 注意 1.4→1.6 破坏性变更（见 AvifRegionDecoder.kt）：RegionDecoder 移除
# subsamplingImage 属性、imageInfo 改为方法、Factory.create 需 suspend。
zoomimage = "1.6.0"

# 依赖注入
hilt = "2.60.1"
hiltNavigationFragment = "1.4.0"

# 导航
navigation = "2.9.8"


# 数据库
room = "2.8.4"

# 列表分组 (未使用)
# groupie = "2.10.1"

# 权限 (使用官方 ActivityResultContracts)
# permissionx = { group = "com.guolindev.permissionx", name = "permissionx", version.ref = "permissionx" }

# 元数据提取
metadataExtractor = "2.20.0"

# RecyclerView
recyclerview = "1.4.0"

# 视频播放
media3 = "1.10.1"

# 拖动选择
dragSelect = "2.4.0"

# 内存泄漏检测
leakcanary = "2.14"

# 协程
coroutines = "1.11.0"

# 核心库脱糖（zoomimage 1.6.0 要求启用，提供 Java 8+ API 回退）
desugarJdkLibs = "2.1.5"

# 生物识别
biometric = "1.1.0"

# 快速滚动
fastscroll = "1.3.0"

# 图片编辑
ucrop = "2.2.11"

# JXL / AVIF 解码
# jxl-coder-glide 2.6.1：运行时依赖 Glide 5.0.7，已随 glide 一并升级。
jxlCoder = "2.6.1"
# avif-coder 2.2.1：基于 libavif/libdav1d 的 AVIF/HEIC 解码库。
# 保留原因：Android 原生解码器仅保证 AVIF baseline（4:2:0 8/10-bit），
# 4:2:2/4:4:4 色度采样与 12-bit 样本需 libavif 软件解码兜底（实测 10-bit 4:4:4 原生失败）。
avifCoder = "2.2.1"

# 测试
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"

[libraries]
# AndroidX 核心
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }

# 图片加载
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }
glide-recyclerview = { group = "com.github.bumptech.glide", name = "recyclerview-integration", version.ref = "glideRecyclerview" }
zoomimage-view = { group = "io.github.panpf.zoomimage", name = "zoomimage-view", version.ref = "zoomimage" }
zoomimage-view-glide = { group = "io.github.panpf.zoomimage", name = "zoomimage-view-glide", version.ref = "zoomimage" }

# 依赖注入
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-fragment = { group = "androidx.hilt", name = "hilt-navigation-fragment", version.ref = "hiltNavigationFragment" }

# 导航
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

# 数据库
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# 列表分组 (未使用，已用 Paging 3 insertSeparators 替代)
# groupie = { group = "com.github.lisawray.groupie", name = "groupie", version.ref = "groupie" }
# groupie-viewbinding = { group = "com.github.lisawray.groupie", name = "groupie-viewbinding", version.ref = "groupie" }

# 权限 (使用官方 ActivityResultContracts)
# permissionx = { group = "com.guolindev.permissionx", name = "permissionx", version.ref = "permissionx" }

# 元数据提取
metadata-extractor = { group = "com.drewnoakes", name = "metadata-extractor", version.ref = "metadataExtractor" }

# 视频播放
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# RecyclerView
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }

# 生物识别
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# 快速滚动
fastscroll = { group = "me.zhanghai.android.fastscroll", name = "library", version.ref = "fastscroll" }

# 拖动选择
drag-select = { group = "com.afollestad", name = "drag-select-recyclerview", version.ref = "dragSelect" }

# JXL / AVIF 解码
jxl-coder-glide = { group = "io.github.awxkee", name = "jxl-coder-glide", version.ref = "jxlCoder" }
avif-coder = { group = "io.github.awxkee", name = "avif-coder", version.ref = "avifCoder" }
avif-coder-glide = { group = "io.github.awxkee", name = "avif-coder-glide", version.ref = "avifCoder" }

# 图片编辑
ucrop = { group = "com.github.yalantis", name = "ucrop", version.ref = "ucrop" }

# 内存泄漏检测
leakcanary = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

# 协程
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# 核心库脱糖
coreLibraryDesugaring = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# 测试
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlinParcelize" }
